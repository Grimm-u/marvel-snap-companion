<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marvel Snap Companion & Meta Advisor</title>
  <style>
    :root {
      --bg-dark: #090b10;
      --panel-bg: #131722;
      --card-bg: #1c2234;
      --primary: #8a2be2;
      --cyan: #00f0ff;
      --red: #ff3366;
      --yellow: #ffcc00;
      --green: #00ff88;
      --text-main: #f1f5f9;
      --text-sub: #94a3b8;
      --border: #2e364f;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-main); padding: 12px; font-size: 14px; }
    
    .header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 10px; border-bottom: 1px solid var(--border); margin-bottom: 12px; }
    .header h1 { font-size: 1.1rem; color: var(--cyan); text-transform: uppercase; letter-spacing: 1px; }

    .layout-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
    @media (min-width: 900px) { .layout-grid { grid-template-columns: 320px 1fr 320px; } }

    .panel { background: var(--panel-bg); border: 1px solid var(--border); border-radius: 8px; padding: 12px; margin-bottom: 12px; }
    .panel h2 { font-size: 0.95rem; color: var(--cyan); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }

    /* Deck Tracker Cards */
    .deck-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .snap-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 6px; padding: 8px 4px; text-align: center; cursor: pointer; user-select: none; position: relative; }
    .snap-card .cost { position: absolute; top: 4px; left: 4px; background: #2563eb; color: #fff; font-size: 0.7rem; font-weight: bold; width: 16px; height: 16px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
    .snap-card .name { font-size: 0.72rem; font-weight: bold; margin-top: 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    
    .snap-card.in-deck { border-color: var(--cyan); color: #fff; }
    .snap-card.drawn { border-color: var(--border); opacity: 0.35; text-decoration: line-through; background: #10141d; }

    /* Controls */
    .turn-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; background: var(--card-bg); padding: 8px 12px; border-radius: 6px; gap: 6px; }
    .turn-btn { background: var(--primary); color: #fff; border: none; padding: 6px 10px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 0.75rem; }
    .reset-btn { background: #334155; color: #fff; border: none; padding: 6px 10px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 0.75rem; }

    /* Controls Dropdowns */
    select { width: 100%; background: var(--card-bg); color: var(--text-main); border: 1px solid var(--border); padding: 6px 10px; border-radius: 6px; font-size: 0.8rem; margin-bottom: 8px; }

    /* Threat Cards & Info Boxes */
    .info-box { background: var(--card-bg); border-left: 4px solid var(--cyan); padding: 8px 10px; border-radius: 4px; margin-bottom: 8px; font-size: 0.8rem; }
    .info-box.danger { border-left-color: var(--red); }
    .info-box.warn { border-left-color: var(--yellow); }
    .info-box.good { border-left-color: var(--green); }
    
    .box-title { font-weight: bold; color: #fff; margin-bottom: 3px; display: flex; justify-content: space-between; }
    .box-sub { font-size: 0.75rem; color: var(--text-sub); line-height: 1.3; }

    /* Retreat Equity Box */
    .equity-box { padding: 10px; border-radius: 6px; background: var(--card-bg); border: 1px solid var(--border); margin-top: 8px; }
    .equity-status { font-weight: bold; font-size: 0.95rem; margin-bottom: 4px; }
  </style>
</head>
<body>

  <div class="header">
    <h1>Marvel Snap Companion</h1>
    <span id="turnLabel" style="color:var(--yellow); font-weight:bold;">Turn 1 / 6</span>
  </div>

  <div class="layout-grid">
    
    <!-- Left Column: Active Deck & Smooth Draw Tracker -->
    <div class="panel">
      <h2>Main Deck Tracker <span id="deckCount" style="font-size:0.75rem; color:var(--text-sub);">12/12 In Deck</span></h2>
      
      <div class="turn-bar">
        <span>Energy: <strong id="energyText" style="color:var(--cyan);">1</strong></span>
        <button class="turn-btn" onclick="nextTurn()">Next Turn</button>
        <button class="reset-btn" onclick="resetMatch()">Reset Game</button>
      </div>

      <div class="deck-grid" id="deckGrid"></div>
      <p style="font-size:0.7rem; color:var(--text-sub); margin-top:8px;">Tap card to toggle [In Deck] ↔ [Drawn/Played]</p>
    </div>

    <!-- Center Column: Opponent Deck Matchup & Location Advisories -->
    <div class="panel">
      <h2>Matchup & Location Intelligence</h2>
      
      <!-- Opponent Selector -->
      <label style="font-size:0.75rem; color:var(--text-sub);">Select Opponent Archetype:</label>
      <select id="opponentSelect" onchange="updateOpponentAdvice()">
        <option value="generic">Unknown / Generic Setup</option>
        <option value="destroy">Classic Destroy (Deadpool/Venom/Knull)</option>
        <option value="clog">Clog & Junk (Viper/Goblins/Cannonball)</option>
        <option value="ongoing">Ongoing Buffs (Patriot/Iron Man/Tribunal)</option>
        <option value="evo">High Evolutionary / Negative</option>
        <option value="discard">Discard / Hela Payload</option>
      </select>

      <div id="opponentContainer"></div>

      <!-- Location Selector -->
      <label style="font-size:0.75rem; color:var(--text-sub); margin-top:10px; display:block;">Active Key Location:</label>
      <select id="locationSelect" onchange="updateLocationAdvice()">
        <option value="none">Standard / Non-Disruptive Terrain</option>
        <option value="kamartaj">Kamar-Taj (On Reveal triggers twice)</option>
        <option value="wakanda">Wakanda (Cards cannot be destroyed)</option>
        <option value="deepspace">Deep Space (Card abilities are disabled)</option>
        <option value="barsinister">Bar Sinister (Fills lane with copies)</option>
        <option value="cloningvats">Cloning Vats (Add copy to hand)</option>
        <option value="sakaar">Sakaar (Put a card from hand here)</option>
      </select>

      <div id="locationContainer"></div>
    </div>

    <!-- Right Column: Retreat Equity & Draw Probability -->
    <div class="panel">
      <h2>Retreat Equity & Odds</h2>
      <div class="equity-box">
        <div class="equity-status" id="equityStatus">Calculating Equity...</div>
        <div style="font-size:0.75rem; color:var(--text-sub);" id="equityDesc">Track your drawn cards to evaluate Snap/Retreat decisions.</div>
      </div>

      <h2 style="margin-top:16px;">Draw Probability</h2>
      <div id="oddsContainer" style="margin-top:6px; font-size:0.85rem;"></div>
    </div>

  </div>

  <script>
    let currentTurn = 1;
    let activeDeck = [];

    // User's Main Arthur Ramp Deck
    const MAIN_DECK = [
      { id: 0, name: "Nebula", cost: 1, state: 'deck' },
      { id: 1, name: "Zabu", cost: 1, state: 'deck' },
      { id: 2, name: "Mobius M. Mobius", cost: 3, state: 'deck' },
      { id: 3, name: "Electro", cost: 3, state: 'deck' },
      { id: 4, name: "Jubilee", cost: 4, state: 'deck' },
      { id: 5, name: "Arthur Pendragon", cost: 4, state: 'deck' },
      { id: 6, name: "En Sabah Nur", cost: 4, state: 'deck' },
      { id: 7, name: "Doctor Doom 2099", cost: 4, state: 'deck' },
      { id: 8, name: "Iron Lad", cost: 4, state: 'deck' },
      { id: 9, name: "Dragon Lord", cost: 5, state: 'deck' },
      { id: 10, name: "Doctor Doom", cost: 6, state: 'deck' },
      { id: 11, name: "Anti-Polar Magneto", cost: 6, state: 'deck' }
    ];

    function resetMatch() {
      currentTurn = 1;
      activeDeck = JSON.parse(JSON.stringify(MAIN_DECK));
      renderAll();
    }

    function toggleCardState(index) {
      activeDeck[index].state = (activeDeck[index].state === 'deck') ? 'drawn' : 'deck';
      renderAll();
    }

    function nextTurn() {
      if (currentTurn < 6) currentTurn++;
      else currentTurn = 1;
      renderAll();
    }

    function renderAll() {
      document.getElementById('turnLabel').innerText = `Turn ${currentTurn} / 6`;
      document.getElementById('energyText').innerText = currentTurn;

      const remainingInDeck = activeDeck.filter(c => c.state === 'deck').length;
      document.getElementById('deckCount').innerText = `${remainingInDeck}/12 In Deck`;

      const grid = document.getElementById('deckGrid');
      grid.innerHTML = activeDeck.map((card, i) => `
        <div class="snap-card ${card.state}" onclick="toggleCardState(${i})">
          <div class="cost">${card.cost}</div>
          <div class="name">${card.name}</div>
        </div>
      `).join('');

      updateOpponentAdvice();
      updateLocationAdvice();
      calculateOddsAndEquity();
    }

    function updateOpponentAdvice() {
      const type = document.getElementById('opponentSelect').value;
      const container = document.getElementById('opponentContainer');
      let html = "";

      if (type === "destroy") {
        html = `
          <div class="info-box danger">
            <div class="box-title">Opponent Threats <span>HIGH DANGER</span></div>
            <div class="box-sub">Watch for Turn 6 Knull or Death + Arnim Zola combos. Armor/Cosmo are missing from your main deck, so focus on pure power output.</div>
          </div>
          <div class="info-box good">
            <div class="box-title">Arthur Ramp Strategy</div>
            <div class="box-sub">Arthur Pendragon pulling Excalibur grants your 4+ Cost cards +2 power, helping Doctor Doom & Magneto outscale Venom/Death across multiple lanes.</div>
          </div>
        `;
      } else if (type === "clog") {
        html = `
          <div class="info-box warn">
            <div class="box-title">Opponent Threats <span>LANE CLOG</span></div>
            <div class="box-sub">Green Goblin/Debrii want to lock your lanes early. Keep your 4-Cost slots open so Arthur Pendragon has space to pull Excalibur.</div>
          </div>
        `;
      } else if (type === "ongoing") {
        html = `
          <div class="info-box warn">
            <div class="box-title">Opponent Tech <span>Enchantress / Rogue</span></div>
            <div class="box-sub">Your Mobius and Excalibur are vulnerable to Ongoing steals/negations. Avoid placing them in the same lane if possible.</div>
          </div>
        `;
      } else {
        html = `
          <div class="info-box">
            <div class="box-title">Primary Tech Counters</div>
            <div class="box-sub"><strong>Shang-Chi:</strong> Hits your 10+ Power payoffs (Doctor Doom 2099 / Magneto). Drop priority on T6 where possible.</div>
          </div>
        `;
      }

      container.innerHTML = html;
    }

    function updateLocationAdvice() {
      const loc = document.getElementById('locationSelect').value;
      const container = document.getElementById('locationContainer');
      let html = "";

      if (loc === "kamartaj") {
        html = `
          <div class="info-box good">
            <div class="box-title">Kamar-Taj Synergy</div>
            <div class="box-sub">Great for Jubilee, Doctor Doom, and Iron Lad! (Note: Arthur Pendragon pulling Excalibur twice won't duplicate Excalibur's ongoing buff).</div>
          </div>
        `;
      } else if (loc === "deepspace") {
        html = `
          <div class="info-box danger">
            <div class="box-title">Deep Space Warning</div>
            <div class="box-sub">Disables On Reveal (Arthur, Electro, Jubilee) and Ongoing (Excalibur, Mobius). Keep key payoff cards away from here!</div>
          </div>
        `;
      } else if (loc === "barsinister") {
        html = `
          <div class="info-box good">
            <div class="box-title">Bar Sinister Play</div>
            <div class="box-sub">Dropping Doctor Doom or Doctor Doom 2099 here fills all lanes with Doom Bots.</div>
          </div>
        `;
      }

      container.innerHTML = html;
    }

    function calculateOddsAndEquity() {
      const remainingCards = activeDeck.filter(c => c.state === 'deck');
      const drawnCards = activeDeck.filter(c => c.state === 'drawn');
      const drawnNames = drawnCards.map(c => c.name);

      const hasRamp = drawnNames.some(n => ["Electro", "Zabu"].includes(n));
      const hasArthur = drawnNames.includes("Arthur Pendragon");
      const hasFinisher = drawnNames.some(n => ["Doctor Doom", "Anti-Polar Magneto", "Dragon Lord"].includes(n));
      
      let equityText = "NEUTRAL EQUITY";
      let equityClass = "equity-warn";
      let equityDesc = "Standard draw curve. Evaluate opponent Snaps carefully.";

      if (currentTurn >= 4) {
        if (!hasRamp && !hasArthur && !hasFinisher) {
          equityText = "LOW EQUITY (RETREAT RECOMMENDED)";
          equityClass = "danger";
          equityDesc = "Missing ramp enablers, Arthur Pendragon, and major finishers by Turn 4. High cube risk.";
        } else if ((hasRamp || hasArthur) && hasFinisher) {
          equityText = "HIGH EQUITY (SNAP POTENTIAL)";
          equityClass = "good";
          equityDesc = "Ramp/Arthur enablers and big finishers available in hand! Ideal position to aggressively Snap.";
        }
      }

      document.getElementById('equityStatus').innerText = equityText;
      document.getElementById('equityStatus').className = `equity-status info-box ${equityClass}`;
      document.getElementById('equityDesc').innerText = equityDesc;

      const remainingInDeck = remainingCards.length;
      const drawsLeft = Math.max(0, 6 - currentTurn);
      const prob = remainingInDeck > 0 ? Math.min(100, Math.round(((drawsLeft + 1) / remainingInDeck) * 100)) : 0;

      document.getElementById('oddsContainer').innerHTML = `
        <p style="margin-bottom:4px;">Cards Left in Deck: <strong>${remainingInDeck}</strong></p>
        <p style="margin-bottom:4px;">Odds to draw a specific card by Turn 6: <strong style="color:var(--green);">${prob}%</strong></p>
      `;
    }

    // Initialize deck on load
    resetMatch();
  </script>
</body>
</html>
